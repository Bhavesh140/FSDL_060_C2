<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhavesh Portfolio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>
body {
    font-family: 'Poppins', sans-serif;
}

.hero {
    height: 100vh;
    background: linear-gradient(135deg,#0d6efd,#6610f2);
    color: white;
}

.glass {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
}

.error {
    color: red;
    font-size: 14px;
}
</style>

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
<div class="container">
<a class="navbar-brand" href="#">Bhavesh</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#about">About</a></li>
<li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
<li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
</ul>
</div>
</div>
</nav>

<!-- Hero -->
<section class="hero d-flex align-items-center text-center">
<div class="container">
<h1 class="display-3 fw-bold">Hi, I'm Bhavesh</h1>
<p class="lead">Computer Science Engineering Student</p>
<button class="btn btn-light mt-4" data-bs-toggle="modal" data-bs-target="#registerModal">
Register Now
</button>
</div>
</section>

<!-- About -->
<section id="about" class="container py-5">
<h2 class="text-center">About Me</h2>
<p class="text-center">Passionate about Web Development & AI</p>
</section>

<!-- Projects -->
<section id="projects" class="container py-5">
<h2 class="text-center">Projects</h2>
<div class="row mt-4">
<div class="col-md-6">
<img src="https://source.unsplash.com/500x300/?technology" class="img-fluid rounded">
<p class="mt-2">Hotel Management System</p>
</div>
<div class="col-md-6">
<img src="https://source.unsplash.com/500x300/?ai" class="img-fluid rounded">
<p class="mt-2">Smart Classroom Monitoring</p>
</div>
</div>
</section>

<!-- Modal Registration -->
<div class="modal fade" id="registerModal">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content glass p-4">

<h4 class="text-center mb-3">Student Registration</h4>

<form id="registrationForm">

<div class="mb-3">
<input type="text" class="form-control" id="name" placeholder="Full Name">
<div id="nameError" class="error"></div>
</div>

<div class="mb-3">
<input type="email" class="form-control" id="email" placeholder="Email">
<div id="emailError" class="error"></div>
</div>

<div class="mb-3">
<input type="text" class="form-control" id="phone" placeholder="Phone Number">
<div id="phoneError" class="error"></div>
</div>

<div class="mb-3">
<input type="password" class="form-control" id="password" placeholder="Password">
<div id="passwordError" class="error"></div>
</div>

<div class="mb-3">
<input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">
<div id="confirmPasswordError" class="error"></div>
</div>

<button class="btn btn-primary w-100">Register</button>

</form>

</div>
</div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
© 2025 Bhavesh | All Rights Reserved
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validation.js"></script>

</body>
</html>
